<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Royal Event Registration</title>
    <style>
        /* --- ROYAL COLOR PALETTE --- */
        :root {
            --royal-red: #9d0208;
            --deep-crimson: #370617;
            --glass-white: rgba(255, 255, 255, 0.12);
            --gold-accent: rgba(255, 215, 0, 0.3);
            --pure-white: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Garamond', serif;
            background-color: var(--deep-crimson);
            background-image: 
                radial-gradient(circle at 20% 30%, #6a040f 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, #9d0208 0%, transparent 40%),
                linear-gradient(135deg, #370617 0%, #03071e 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .registration-card {
            background: var(--glass-white);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            width: 90%;
            max-width: 420px;
            padding: 50px 40px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), inset 0 0 15px var(--gold-accent); 
        }

        h2 { 
            color: var(--pure-white); 
            text-align: center; 
            font-size: 2.2rem;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 4px;
            font-weight: 300;
        }

        p {
            text-align: center;
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            margin-bottom: 40px;
            font-style: italic;
        }

        label {
            display: block;
            color: var(--pure-white);
            margin-bottom: 8px;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        input, select {
            width: 100%;
            padding: 14px;
            margin-bottom: 25px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: white;
            outline: none;
        }

        input:focus { border-color: rgba(255, 255, 255, 0.5); }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(to right, #d00000, #9d0208);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover { filter: brightness(1.2); letter-spacing: 4px; }

        option { background-color: #370617; color: white; }
    </style>
</head>
<body>

    <div class="registration-card">
        <h2>Invitation</h2>
        <p>A Grand Gala of Innovation</p>
        <p>welcomeeeee!!!!!</p>

        <form action="process.html" method="GET">
            <label for="name">Your Distinguished Name</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Digital Address</label>
            <input type="email" id="email" name="email" required>

            <label for="ticket">Attendance Tier</label>
            <select id="ticket" name="ticket">
                <option value="Grand Tier">Grand Tier</option>
                <option value="Royal Suite">Royal Suite</option>
                <option value="Ambassador Pass">Ambassador Pass</option>
            </select>

            <button type="submit">Accept Invitation</button>
        </form>
    </div>

</body>
</html>
